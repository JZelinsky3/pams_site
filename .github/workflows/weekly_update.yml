name: Weekly Sleeper Update

on:
  # Schedule turned off 2026-09-30: pams_site is retired (pickems and power
  # rankings live on The Sunday Chronicle now), and this run had failed every
  # Tuesday since 2026-09-01. To bring it back, restore:
  #   schedule:
  #     - cron: '0 16 * * 2'   # Tuesdays, 4pm UTC
  workflow_dispatch:   # allow manual trigger from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run weekly update
        run: python scripts/sleeper_update.py

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pickems/teams.json pickems/manifest.json pickems/weeks/ \
                  powerrank/manifest.json powerrank/weeks/
          git diff --staged --quiet && echo "No changes." || (
            git commit -m "auto: weekly update $(date -u +%Y-%m-%d)" &&
            git push
          )
